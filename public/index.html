<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Express on Vercel</title>
<link rel="stylesheet" href="/style.css"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    @font-face {
        font-family: 'Default';
        src: url("/default_normal.ttf") format("truetype");
    }
    
     body {
        font-family: 'Default', sans-serif;
        margin: 0;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        background-color: #141d2c;
    }
    
    .main-navbar {
        width: 100%;
        height: 7.5vh;
        background-color: #141d2c;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        bottom: 0;
    }
    .main-navbar div {
    height: 100%;
    margin: 0 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5px
    }
    
    .main-navbar a {
        color: #fff;
        text-decoration: none;
        font-size: 11.5px;
        margin-bottom: 0px;
    }
    
    .main-navbar img {
        height: 25px;
        width: 25px;
        margin-top: 0px;
    }
    
    .main-page {
        height: 92.5vh;
        width: 100%;
        overflow: hidden;
        background-color: #010a13;
        color: #fff;
        padding: 0 15px;
    }
    
    .main-page .header img {
        height: 50px;
        width: 50px;
    }
    
    .main-page .choice-menu {
        display: flex;
        justify-content: space-between;
        font-size: 15px;
        margin: 0 20px;
    }
    
    .main-page .choice-menu div {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        
    }
    
    .main-page .choice-menu button {
        background-color: #84e8ff;
        height: 50px;
        width: 50px;
        border-radius: 100px;
        border: none;
    }
    
    .main-page .choice-menu button img {
        height: 30px;
        width: 30px;
    }
    
    .main-page .choice-menu p {
        margin: 10px 0;
    }
    
    

    
</style>

</head>


<body>
    <div class="main-navbar">
        <div>
            <img src="/accueil.svg"/>
            <a href="/accueil">Accueil</a>
        </div>
        <div>
            <img src="/drops.svg"/>
            <a href="/drops">Drops</a>
        </div>
        <div>
            <img src="/favoris.svg" />
            <a href="/favoris">Favoris</a>
        </div>
        <div>
            <img src="/profil.svg"/>
            <a href="/profil">Profil</a>
        </div>
    </div>
    <div class="main-page">
        <div class="header">
            <img src="/skyscanner.png">
        </div>
        <div class="choice-menu">
            <div>
                <button>
                    <img src="/avion.svg">
                </button>
                <p>Vols</p>
            </div>
            <div>
                <button>
                    <img src="/lit.svg">
                </button>
                <p>Hébergements</p>
            </div>
            <div>
                <button>
                    <img src="/voiture.svg">
                </button>
                <p>Voitures</p>
            </div>
        </div>
    </div>
</body>
</html>
